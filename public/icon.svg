<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#080C14" />
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base background with rounded corners -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4" />
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="rgba(59,130,246,0.25)" stroke-width="2" />

  <!-- Glowing Star ✦ -->
  <g filter="url(#glow)">
    <path d="M 256 96 
             C 256 185 275 204 364 256 
             C 275 308 256 327 256 416 
             C 256 327 237 308 148 256 
             C 237 204 256 185 256 96 Z" 
          fill="url(#starGrad)" />
  </g>

  <!-- Subtle Center Core Light -->
  <circle cx="256" cy="256" r="28" fill="#FFFFFF" opacity="0.85" filter="url(#glow)" />
</svg>
